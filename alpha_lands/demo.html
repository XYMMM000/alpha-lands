<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Lands · 差异化演示与录制</title><style>
*{box-sizing:border-box}body{margin:0;background:#183226;color:#f6f3df;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header strong{margin-right:auto}button,a{font:inherit;border:1px solid #8a9f73;background:#e4eacc;color:#35563a;border-radius:5px;padding:8px 12px;cursor:pointer;text-decoration:none}button:disabled{opacity:.45;cursor:wait}select{padding:7px;background:#edf0dc;border-radius:5px;color:#35563a}#stage{max-width:1480px;margin:0 auto;background:#0e2118;border:1px solid #68825a}iframe{display:block;width:100%;height:720px;border:0;background:#d6dec1}.caption{padding:14px 20px;min-height:90px;background:#213e2c;line-height:1.8}#scene{font-size:11px;color:#a7bf8e;letter-spacing:1px}.caption p{margin:6px 0;font-size:16px}footer{padding:12px 20px;font-size:11px;line-height:1.8;color:#aabd9c}#download{display:none}#status{font-size:12px}#stage.phone{max-width:390px}#stage.phone iframe{height:844px}.warning{color:#e4c69b}@media(max-width:760px){header{padding:12px}button,a,select{font-size:11px;padding:7px}iframe{height:740px}.caption p{font-size:13px}}
</style></head><body>
<header><strong>ALPHA LANDS / 两条差异化演示</strong><button id="play">连续播放（约 4 分钟）</button><button id="pause">暂停</button><button id="next">下一步</button><select id="path" aria-label="演示路径"><option value="fox">A · 假设验证</option><option value="owl">B · 风险研究</option></select><select id="size" aria-label="预览尺寸"><option value="desktop">桌面布局</option><option value="phone">390px 手机布局</option></select><button id="record">录制当前标签页</button><a id="download">下载视频</a></header>
<div id="stage"><iframe id="game" title="独立演示局" src="index.html?demo=1"></iframe><div class="caption"><div id="scene">SCRIPTED DEMO / 模拟玩家行为，不是真人试玩</div><p id="caption">点击连续播放，演示卡牌操作、画像、推荐与两种不同的后续学习任务。演示不会写入你的游戏存档。</p></div></div>
<footer><div id="status">准备就绪</div><div class="warning">录制需你手动选择当前标签页并同意共享。仅录制画面，无麦克风或系统声音；取消后仍可播放。请选择此演示页，避免录入其他窗口。课程资源不等同已执行第三方回测。</div>建议使用本机 http://127.0.0.1:8787/demo.html；file:// 下跨文件访问可能受浏览器限制。手机布局预览不等同实体手机验收。</footer>
<script src="demo-paths.js"></script><script>
const frame=document.querySelector('#game'),paths=window.AlphaDemoPaths;let path='fox',index=0,playing=false,timer,recorder,stream,chunks=[];
function status(text){document.querySelector('#status').textContent=text}
function ready(){try{return Boolean(frame.contentWindow.ALP?.demoStep)}catch{return false}}
function load(which){clearTimeout(timer);path=which;index=0;document.querySelector('#path').value=which;frame.src='index.html?demo=1&route='+which+'&run='+Date.now()}
async function next(){clearTimeout(timer);if(!ready()){playing=false;status('页面尚未就绪。请通过本机 HTTP 服务打开，等待加载后重试。');return}const steps=paths[path].steps;if(index>=steps.length){if(path==='fox'&&playing){load('owl');frame.addEventListener('load',()=>{if(playing)next()},{once:true});return}playing=false;status('两条路径或当前手动路径已完成；可切换路径重新播放。');if(recorder?.state==='recording')stopRecord();return}const [caption,action,arg,seconds]=steps[index];try{frame.contentWindow.ALP.demoStep(action,arg);document.querySelector('#scene').textContent=paths[path].name+' / '+(index+1)+' / '+steps.length+' · 模拟玩家行为';document.querySelector('#caption').textContent=caption;index++;status('已执行 '+action+'；通过正常游戏逻辑推进。');if(playing)timer=setTimeout(next,seconds*1000)}catch(error){playing=false;status('演示停止：'+error.message)}}
document.querySelector('#play').onclick=()=>{if(playing)return;playing=true;if(index>=paths[path].steps.length){load('fox');frame.addEventListener('load',()=>next(),{once:true})}else next()};document.querySelector('#pause').onclick=()=>{playing=false;clearTimeout(timer);status('已暂停；录制如已开始仍继续，可点击结束录制。')};document.querySelector('#next').onclick=()=>{playing=false;next()};document.querySelector('#path').onchange=e=>{playing=false;load(e.target.value)};document.querySelector('#size').onchange=e=>document.querySelector('#stage').classList.toggle('phone',e.target.value==='phone');
async function stopRecord(){if(recorder&&recorder.state!=='inactive')recorder.stop();stream?.getTracks().forEach(t=>t.stop());document.querySelector('#record').textContent='录制当前标签页'}
document.querySelector('#record').onclick=async()=>{if(recorder?.state==='recording'){stopRecord();return}if(!navigator.mediaDevices?.getDisplayMedia||typeof MediaRecorder==='undefined'){status('当前浏览器不支持录制，请使用桌面 Chrome 或 Edge，或用系统录屏。');return}try{stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser',frameRate:15},audio:false});chunks=[];const type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType}),link=document.querySelector('#download');if(link.href.startsWith('blob:'))URL.revokeObjectURL(link.href);link.href=URL.createObjectURL(blob);link.download='Alpha-Lands-demo.webm';link.style.display='inline-block';status('录像已生成，点击「下载视频」保存。请检查字幕、画面和隐私内容后提交。')};stream.getVideoTracks()[0].onended=()=>{if(recorder.state!=='inactive')recorder.stop()};recorder.start(1000);document.querySelector('#record').textContent='结束录制';status('正在录制。点击连续播放，完整展示两条路径；完成后自动停止。')}catch{status('未开始录制；你可以继续使用演示播放。')}};
</script></body></html>
